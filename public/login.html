<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antiyoy Online — Вход</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="screen" style="display:flex;align-items:center;justify-content:center;">
    <form id="loginForm" class="card" autocomplete="on">
      <h1>Antiyoy <span>Online</span></h1>
      <p class="hint">Войдите, чтобы играть. Аккаунты выдаёт администратор.</p>
      <label>Логин
        <input id="username" name="username" autocomplete="username" maxlength="32" required />
      </label>
      <label>Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button class="primary" type="submit" style="margin-top:14px;">Войти</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
  <script src="login.js"></script>
</body>
</html>
