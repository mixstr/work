<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antiyoy Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Lobby / menu -->
  <div id="menu" class="screen">
    <div class="card">
      <h1>Antiyoy <span>Online</span></h1>
      <label>Ваше имя
        <input id="name" maxlength="16" placeholder="Игрок" />
      </label>

      <div class="row">
        <button id="btnCreate" class="primary">Создать игру</button>
      </div>

      <div class="divider">или</div>

      <div class="row">
        <input id="joinCode" maxlength="4" placeholder="КОД" style="text-transform:uppercase" />
        <button id="btnJoin">Войти</button>
      </div>

      <details class="settings">
        <summary>Настройки карты (для новой игры)</summary>
        <label>Ширина <input id="optW" type="number" min="6" max="24" value="14" /></label>
        <label>Высота <input id="optH" type="number" min="6" max="20" value="11" /></label>
        <label>Макс. игроков <input id="optMax" type="number" min="2" max="6" value="4" /></label>
      </details>

      <p id="menuError" class="error"></p>
    </div>
  </div>

  <!-- Lobby waiting room -->
  <div id="lobby" class="screen hidden">
    <div class="card">
      <h2>Комната <span id="lobbyCode" class="code"></span></h2>
      <p class="hint">Поделитесь кодом с друзьями, чтобы они вошли.</p>
      <ul id="playerList"></ul>
      <button id="btnStart" class="primary hidden">Начать игру</button>
      <p id="lobbyHint" class="hint"></p>
    </div>
  </div>

  <!-- Game -->
  <div id="game" class="screen hidden">
    <canvas id="board"></canvas>

    <div id="topbar">
      <span id="roomTag" class="tag"></span>
      <span id="turnTag" class="tag"></span>
    </div>

    <div id="panel">
      <div id="provInfo" class="prov-info">Выберите свою провинцию</div>
      <div class="buttons">
        <button data-buy="peasant" class="buy">Крестьянин<small>10</small></button>
        <button data-buy="farm" class="buy">Ферма<small id="farmCost">12</small></button>
        <button data-buy="tower" class="buy">Башня<small>15</small></button>
        <button data-buy="strongTower" class="buy">Сильн. башня<small>35</small></button>
      </div>
      <div id="hand" class="hand hidden"></div>
      <button id="btnEnd" class="endturn">Завершить ход</button>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
